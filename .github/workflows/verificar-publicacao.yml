name: Preparar tag pública da compilação
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-publicacao.yml']
permissions:
  contents: write
jobs:
  prepare-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Criar tag no HEAD público atual
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/build-0.9.2-beta.15-43222962335' -f sha="$GITHUB_SHA" --jq '.ref'
