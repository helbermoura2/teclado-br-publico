name: Verificar publicação no HEAD público
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-publicacao.yml']
permissions:
  contents: write
jobs:
  publish-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Testar Release com target main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --include --method POST "repos/$GH_REPO/releases" -f tag_name="probe-publicacao-$GITHUB_RUN_ID" -f target_commitish=main -f name='Teste privado de publicação' -F draft=true
