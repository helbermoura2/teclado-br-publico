name: HBX beta19 OpenRouter - compilar e testar
on:
  workflow_dispatch:
  push:
    branches: [feat/hbx-openrouter-preserve-groq-20261113]
    paths: ['heliboard/**', '.github/workflows/hbx-openrouter-beta19-qa.yml']
permissions:
  contents: write
concurrency:
  group: hbx-openrouter-beta19-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validar publicação antes de compilar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p candidate
          echo '{"publicationCheck":true}' > candidate/pipeline-check.json
          tag="build-0.9.2-beta.19-$GITHUB_RUN_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" candidate/pipeline-check.json --clobber
          else
            gh release create "$tag" --draft --target main --title 'Candidato não assinado — validação pendente' --notes 'Compilação sem chave privada. Não instalar.' candidate/pipeline-check.json
          fi
      - uses: actions/checkout@v4
        with:
          repository: HeliBorg/HeliBoard
          ref: f8ec91a982835911cc224fa99434c3396d4cd562
          path: heli-source
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: heli-source/ai-native/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar estado da barra
        run: java heliboard/tests/RunToolbarTests.java
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Preparar fontes correspondentes sem chave de assinatura
        env:
          TECLADO_UNSIGNED_BUILD: '1'
        run: |
          python3 heliboard/prepare.py heli-source
          mkdir -p candidate
          tar --exclude=.git --exclude=build --exclude=.gradle --exclude=ai-build --exclude='*.gguf' -czf candidate/teclado-br-heli-0.9.2-beta.19-fontes.tar.gz -C heli-source .
      - name: Reutilizar motor offline idêntico da beta.15 verificada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json,subprocess
          from pathlib import Path
          delta=json.loads(subprocess.check_output(['gh','api','repos/helbermoura2/teclado-br-publico/compare/2684bd2fcd3d1ae10e990d19832b09d03d89b6c2...'+__import__('os').environ['GITHUB_SHA']]))
          assert len(delta['files'])<300
          assert not any(f['filename'].startswith('heliboard/ai/native/') or f['filename']=='heliboard/ai/build-native.sh' for f in delta['files'])
          assert json.loads(Path('heliboard/upstream.json').read_text())['ai_runtime']['commit']=='0ec4027a2a0183de87c007069adddc06e665f7de'
          PYTHON
          mkdir -p previous
          curl --fail --silent --show-error --location --output previous/teclado-br-heli-0.9.2-beta.15.apk 'https://github.com/helbermoura2/teclado-br-publico/releases/download/heli-0.9.2-beta.15/teclado-br-heli-0.9.2-beta.15.apk' 
          echo '1a1327b07e816131b602e0042e536288c480ae2157d377b1293466c9c8d6e6cb  previous/teclado-br-heli-0.9.2-beta.15.apk' | sha256sum -c -
          python3 - <<'PYTHON'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('previous/teclado-br-heli-0.9.2-beta.15.apk') as apk:
              for abi in ('arm64-v8a','x86_64'):
                  p=Path('heli-source/app/src/main/jniLibs')/abi/'libtecladoai.so'
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(apk.read('lib/'+abi+'/libtecladoai.so'))
          PYTHON

      - name: Preparar runtime de testes
        run: bash heliboard/ci/preload-robolectric.sh
      - name: Testar e compilar APK
        working-directory: heli-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testRunTestsUnitTest assembleDebugNoMinify
      - name: Alinhar APK e calcular pedido público de assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 heli-source/app/build/outputs/apk/debugNoMinify/*-unsigned.apk candidate/unsigned.apk
          python3 heliboard/ci/apk_v2.py request candidate/unsigned.apk > candidate/request.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('candidate/request.json');m=json.loads(p.read_text());m.update(commit=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'],versionCode=9020,versionName='0.9.2-beta.19-hbx',packageName='br.com.tecladobr.heli.debug',candidateTag='build-0.9.2-beta.19-'+os.environ['GITHUB_RUN_ID']);p.write_text(json.dumps(m))
          print('APK_SIGNING_REQUEST '+json.dumps(m,separators=(',',':')))
          PY
      - name: Validar protocolo com certificado descartável
        run: bash heliboard/ci/roundtrip.sh
      - name: Guardar candidato privado em rascunho de release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json;print(json.load(open("candidate/request.json"))["candidateTag"])')
          gh release upload "$tag" candidate/* --clobber
  ui:
    name: Testar barra no Android
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Recuperar APK de interação da mesma compilação
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "build-0.9.2-beta.19-$GITHUB_RUN_ID" --pattern ui-test.apk --dir candidate
      - name: Habilitar KVM para teste de interação
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disk-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 540x1170
            adb shell wm density 220
            adb shell input keyevent 82
            adb install -r candidate/ui-test.apk
            adb logcat -c
            timeout 180s adb shell am instrument -w -e phase verify_toolbar br.com.tecladobr.heli.debug/br.com.tecladobr.heli.testing.HeliTrialInstrumentation | tee candidate/toolbar-test.txt
            timeout 180s adb shell am instrument -w -e phase verify_typing_profiles br.com.tecladobr.heli.debug/br.com.tecladobr.heli.testing.HeliTrialInstrumentation | tee candidate/typing-test.txt
            adb logcat -d -b crash
            adb logcat -d -s AndroidRuntime
            timeout 15s adb exec-out run-as br.com.tecladobr.heli.debug tar -cf - -C cache heli-shots > candidate/toolbar-screenshots.tar || true
            gh release upload "build-0.9.2-beta.19-$GITHUB_RUN_ID" candidate/toolbar-test.txt candidate/typing-test.txt candidate/toolbar-screenshots.tar --clobber
            grep -F 'result=PASS' candidate/toolbar-test.txt
            grep -F 'result=PASS' candidate/typing-test.txt
      - name: Guardar relatório já capturado
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f candidate/toolbar-test.txt ]; then
            gh release upload "build-0.9.2-beta.19-$GITHUB_RUN_ID" candidate/*-test.txt --clobber
          fi
