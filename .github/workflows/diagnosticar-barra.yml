name: Diagnosticar barra no Android
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnosticar-barra.yml']
permissions:
  contents: write
jobs:
  ui:
    name: Testar barra no Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Recuperar APK de interação da mesma compilação
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "build-0.9.2-beta.16-43238645564" --pattern ui-test.apk --dir candidate
      - name: Habilitar KVM para teste de interação
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disk-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 540x1170
            adb shell wm density 220
            adb shell input keyevent 82
            adb install -r candidate/ui-test.apk
            adb logcat -c
            timeout 180s adb shell am instrument -w -e phase verify_toolbar br.com.tecladobr.heli.debug/br.com.tecladobr.heli.testing.HeliTrialInstrumentation | tee candidate/toolbar-test.txt
            adb logcat -d -b crash
            adb logcat -d -s AndroidRuntime
            timeout 15s adb exec-out run-as br.com.tecladobr.heli.debug tar -cf - -C cache heli-shots > candidate/toolbar-screenshots.tar || true
            gh release upload "build-0.9.2-beta.16-43238645564" candidate/toolbar-test.txt candidate/toolbar-screenshots.tar --clobber
            grep -F 'result=PASS' candidate/toolbar-test.txt
      - name: Guardar relatório já capturado
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f candidate/toolbar-test.txt ]; then
            gh release upload "build-0.9.2-beta.16-43238645564" candidate/toolbar-test.txt --clobber
          fi
