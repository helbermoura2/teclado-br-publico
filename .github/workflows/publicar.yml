name: Verificar e publicar APK assinado
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/release-signature.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: teclado-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Conferir origem e recuperar candidato exato
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,subprocess,re
          from pathlib import Path
          m=json.loads(Path('.github/release-signature.json').read_text())
          assert m['packageName']=='br.com.tecladobr.heli.debug' and m['versionCode']==9016
          assert m['versionName']=='0.9.2-beta.15-heli3.6'
          assert re.fullmatch(r'[0-9a-f]{40}',m['commit'])
          assert re.fullmatch(r'build-0[.]9[.]2-beta[.]15-[0-9]+',m['candidateTag'])
          r=json.loads(subprocess.check_output(['gh','api','repos/helbermoura2/teclado-br-publico/actions/runs/'+str(int(m['runId']))]))
          assert r['conclusion']=='success' and r['head_sha']==m['commit'] and r['path']=='.github/workflows/compilar.yml'
          subprocess.run(['gh','release','download',m['candidateTag'],'--dir','candidate'],check=True)
          original=json.loads(Path('candidate/request.json').read_text())
          assert all(m.get(k)==v for k,v in original.items())
          PY
      - name: Reconstruir APK com assinatura pública
        run: python3 heliboard/ci/apk_v2.py assemble candidate/unsigned.apk .github/release-signature.json candidate/teclado-br-heli-0.9.2-beta.15.apk
      - name: Verificação independente de assinatura e identidade Android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 candidate/teclado-br-heli-0.9.2-beta.15.apk | tee candidate/signature-verification.txt
          grep -F 'Signer #1 certificate SHA-256 digest: b758875ca8380d3b2ba0aa7b2b34a17f785aac3d0c4d1874674266a8877e9d45' candidate/signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 candidate/teclado-br-heli-0.9.2-beta.15.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging candidate/teclado-br-heli-0.9.2-beta.15.apk > candidate/badging.txt
          grep -F "package: name='br.com.tecladobr.heli.debug' versionCode='9016' versionName='0.9.2-beta.15-heli3.6'" candidate/badging.txt
          grep -F "sdkVersion:'26'" candidate/badging.txt
      - name: Preparar metadados de atualização
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('candidate/teclado-br-heli-0.9.2-beta.15.apk'); base='https://github.com/helbermoura2/teclado-br-publico/releases/'
          m=dict(schema='teclado-br-updates-v1',enabled=True,packageName='br.com.tecladobr.heli.debug',versionCode=9016,versionName='0.9.2-beta.15-heli3.6',sha256=hashlib.sha256(p.read_bytes()).hexdigest(),signerSha256='b758875ca8380d3b2ba0aa7b2b34a17f785aac3d0c4d1874674266a8877e9d45',sizeBytes=p.stat().st_size,apkUrl=base+'download/heli-0.9.2-beta.15/'+p.name,releaseUrl=base+'tag/heli-0.9.2-beta.15',notes='Barra com palavras durante a digitação e atalhos após ponto. Instale por cima da versão atual. Teste no aparelho pendente.')
          Path('candidate/teclado-br-update.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          files=[p,Path('candidate/teclado-br-heli-0.9.2-beta.15-fontes.tar.gz')]
          Path('candidate/SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in files))
          PY
          cat > candidate/notes.txt <<'NOTES'
          Barra compacta: sugestões de palavras durante a digitação; atalhos após ponto; sugestões voltam na frase seguinte. Preserva as funções de IA, prancheta e dicionário da beta.14.

          Instale por cima da versão atual, sem desinstalar. Mesmo pacote e certificado, versão 9016.

          Verificações: testes JVM, compilação Android, alinhamento e assinatura verificada pelo apksigner. Teste visual e de interação no aparelho ainda pendente.
          NOTES
      - name: Publicar somente APK verificado e fontes correspondentes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(python3 -c 'import json;print(json.load(open(".github/release-signature.json"))["commit"])')
          gh release create heli-0.9.2-beta.15 --target "$commit" --title 'Teclado BR 0.9.2-beta.15 — barra por frase' --notes-file candidate/notes.txt candidate/teclado-br-heli-0.9.2-beta.15.apk candidate/teclado-br-heli-0.9.2-beta.15-fontes.tar.gz candidate/teclado-br-update.json candidate/SHA256SUMS candidate/signature-verification.txt candidate/badging.txt
      - name: Atualizar manifesto público
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import subprocess,json,base64
          from pathlib import Path
          endpoint='repos/helbermoura2/teclado-br-publico/contents/update.json'
          payload=dict(message='Publicar manifesto da atualização beta.15',content=base64.b64encode(Path('candidate/teclado-br-update.json').read_bytes()).decode(),branch='main')
          existing=subprocess.run(['gh','api',endpoint],capture_output=True,text=True)
          if existing.returncode==0:payload['sha']=json.loads(existing.stdout)['sha']
          subprocess.run(['gh','api','--method','PUT',endpoint,'--input','-'],input=json.dumps(payload),text=True,check=True,stdout=subprocess.DEVNULL)
          PY
