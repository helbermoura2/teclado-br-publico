name: Compilar Teclado BR público
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['heliboard/**', '.github/workflows/compilar.yml']
permissions:
  contents: write
concurrency:
  group: teclado-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeliBorg/HeliBoard
          ref: f8ec91a982835911cc224fa99434c3396d4cd562
          path: heli-source
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: heli-source/ai-native/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar estado da barra
        run: java heliboard/tests/RunToolbarTests.java
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Preparar fontes correspondentes sem chave de assinatura
        env:
          TECLADO_UNSIGNED_BUILD: '1'
        run: |
          python3 heliboard/prepare.py heli-source
          mkdir candidate
          tar --exclude=.git --exclude=build --exclude=.gradle --exclude=ai-build --exclude='*.gguf' -czf candidate/teclado-br-heli-0.9.2-beta.15-fontes.tar.gz -C heli-source .
      - name: Recuperar motor idêntico da compilação inicial
        id: bootstrap-native
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import subprocess,json,hashlib,zipfile,os
          from pathlib import Path
          # This exact bootstrap build contains the same pinned native sources.
          # Only UpdatePolicy.java and publication workflows changed afterwards.
          allowed={'heliboard/ai/java/UpdatePolicy.java','heliboard/overlay/TecladoBrDefaults.kt','heliboard/patches/toolbar.py'}
          comparison=json.loads(subprocess.check_output(['gh','api','repos/helbermoura2/teclado-br-publico/compare/81a9a194f24a8a5753ec2b4db00b5aff231134d6...'+os.environ['GITHUB_SHA']]))
          changed=[f['filename'] for f in comparison['files']]
          if len(changed)>=300 or any(n not in allowed and not n.startswith('.github/') for n in changed):
              print('Other source changes: building native sources instead.')
              raise SystemExit(0)
          tag='build-0.9.2-beta.15-43221553354'
          result=subprocess.run(['gh','release','download',tag,'--dir','bootstrap','--pattern','unsigned.apk','--pattern','request.json'],capture_output=True)
          if result.returncode==0:
              m=json.loads(Path('bootstrap/request.json').read_text())
              apk=Path('bootstrap/unsigned.apk')
              assert m['commit']=='81a9a194f24a8a5753ec2b4db00b5aff231134d6'
              assert hashlib.sha256(apk.read_bytes()).hexdigest()==m['unsignedSha256']
              with zipfile.ZipFile(apk) as z:
                  for abi in ['arm64-v8a','x86_64']:
                      out=Path('heli-source/app/src/main/jniLibs')/abi/'libtecladoai.so'
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(z.read('lib/'+abi+'/libtecladoai.so'))
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('restored=true\n')
              print('Reused exact native binaries from verified bootstrap input.')
          else:print('Bootstrap unavailable: building native sources.')
          PYTHON
      - name: Compilar motor offline
        if: steps.bootstrap-native.outputs.restored != 'true'
        run: bash heliboard/ai/build-native.sh heli-source
      - name: Preparar runtime de testes
        run: bash heliboard/ci/preload-robolectric.sh
      - name: Testar e compilar APK
        working-directory: heli-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testRunTestsUnitTest assembleDebugNoMinify
      - name: Alinhar APK e calcular pedido público de assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 heli-source/app/build/outputs/apk/debugNoMinify/*-unsigned.apk candidate/unsigned.apk
          python3 heliboard/ci/apk_v2.py request candidate/unsigned.apk > candidate/request.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('candidate/request.json');m=json.loads(p.read_text());m.update(commit=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'],versionCode=9016,versionName='0.9.2-beta.15-heli3.6',packageName='br.com.tecladobr.heli.debug',candidateTag='build-0.9.2-beta.15-'+os.environ['GITHUB_RUN_ID']);p.write_text(json.dumps(m))
          print('APK_SIGNING_REQUEST '+json.dumps(m,separators=(',',':')))
          PY
      - name: Validar protocolo com certificado descartável
        run: bash heliboard/ci/roundtrip.sh
      - name: Guardar candidato privado em rascunho de release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json;print(json.load(open("candidate/request.json"))["candidateTag"])')
          gh release create "$tag" --draft --target main --title 'Candidato não assinado — validação pendente' --notes 'Compilação sem chave privada. Não instalar.' candidate/*
