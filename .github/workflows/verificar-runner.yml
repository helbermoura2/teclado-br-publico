name: Verificar runner público
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-runner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar que o runner público iniciou
        run: |
          echo 'Runner público iniciou. Nenhum segredo ou assinatura foi acessado.'
          java -version
          df -h .
